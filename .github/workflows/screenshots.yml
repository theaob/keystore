name: Screenshots

# Renders every screen with Robolectric: review screenshots go to docs/screenshots, Google Play
# listing screenshots to fastlane/metadata/android/en-US/images/phoneScreenshots.
#
# Manual only (Actions > Screenshots > Run workflow, on a feature branch). Running on every push
# made the bot commit regenerated PNGs to both main and PR branches, which then conflicted.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Render screens
        run: ./gradlew :app:testDebugUnitTest --tests 'com.onurbaykal.keystoremanager.ui.ScreenshotTest'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            docs/screenshots/*.png
            fastlane/metadata/android/en-US/images/phoneScreenshots/*.png
            app/build/reports/tests/
          if-no-files-found: ignore

      - name: Commit screenshots
        # Never commit to main: screenshots land there through the PR that updates them.
        if: always() && github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots fastlane/metadata/android/en-US/images/phoneScreenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "Update UI screenshots [skip ci]"
            # Freshly rendered screenshots win over any concurrent screenshot commit.
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
